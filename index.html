<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DJ PILU — Pierluigi Berardi</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root{--gold:#C9A84C;--gl:#E8C97A;--gg:rgba(201,168,76,.35);--dark:#060606;--d2:#0E0E0E;--d3:#141414;--light:#F0EDE8;--mu:rgba(240,237,232,.6)}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{background:var(--dark);color:var(--light);font-family:'Inter',sans-serif;overflow-x:hidden;line-height:1.6}
        h1,h2,h3,.bn{font-family:'Bebas Neue',cursive;letter-spacing:1px;text-transform:uppercase}
        
        #sc{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.5}
        .main{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:0 20px}
        
        nav{height:90px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.05);margin-bottom:60px}
        .l{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:10px}
        .l span{color:var(--light);font-weight:300;font-size:14px;letter-spacing:3px}
        .si{display:flex;gap:20px}
        .si a{color:var(--light);text-decoration:none;font-size:20px;transition:.3s}
        .si a:hover{color:var(--gold);transform:translateY(-3px)}

        header{text-align:center;padding:40px 0 100px}
        .ht{font-size:clamp(60px,15vw,180px);line-height:.85;margin-bottom:20px;background:linear-gradient(to bottom, #fff 30%, var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
        .hs{font-family:'Space Grotesk',sans-serif;font-size:clamp(14px,2vw,18px);text-transform:uppercase;letter-spacing:8px;color:var(--mu);margin-bottom:40px;display:block}
        
        section{margin-bottom:120px}
        .st{font-size:40px;margin-bottom:40px;display:flex;align-items:center;gap:20px}
        .st::after{content:'';height:1px;background:var(--gg);flex:1}

        /* EVENTS GRID */
        .eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:30px}
        .ec{background:var(--d2);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.05);transition:.4s;position:relative}
        .ec:hover{transform:translateY(-10px);border-color:var(--gg);box-shadow:0 20px 40px rgba(0,0,0,.4)}
        .ei{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
        .ed{padding:20px;background:linear-gradient(transparent, rgba(0,0,0,.9));position:absolute;bottom:0;width:100%;display:flex;justify-content:space-between;align-items:flex-end}
        .et{font-size:24px;color:var(--gold)}
        .ey{font-size:14px;color:var(--mu)}

        /* VIBES GALLERY */
        .vg{columns:2;column-gap:15px}
        .vi{break-inside:avoid;margin-bottom:15px;border-radius:10px;overflow:hidden;cursor:pointer;position:relative;border:1px solid rgba(255,255,255,.05);transition:.3s}
        .vi:hover{border-color:var(--gold);transform:scale(1.02)}
        .vi img,.vi video{width:100%;display:block}
        .vp{position:absolute;top:15px;right:15px;background:rgba(0,0,0,.6);width:35px;height:35px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;backdrop-filter:blur(4px)}

        /* REVIEWS */
        .rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:25px}
        .rc{background:var(--d3);padding:30px;border-radius:15px;border-left:4px solid var(--gold)}
        .rn{font-weight:700;margin-bottom:10px;display:block}
        .rt{font-style:italic;color:var(--mu);font-size:15px}
        .rs{color:var(--gold);margin-top:15px;font-size:12px;display:block}

        /* MODAL */
        #lb{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px)}
        #lb.show{display:flex}
        #lb img,#lb video{max-width:100%;max-height:90vh;border-radius:8px;box-shadow:0 0 50px rgba(0,0,0,1)}
        #lbc{position:absolute;top:30px;right:30px;font-size:40px;cursor:pointer}

        @media(max-width:768px){ .vg{columns:2} .ht{font-size:80px} nav{height:70px} }
        .reveal{opacity:0;transform:translateY(30px);transition:1s ease-out}
        .reveal.on{opacity:1;transform:translateY(0)}
    </style>
</head>
<body>

<canvas id="sc"></canvas>

<div class="main">
    <nav>
        <a href="#" class="l">PILU<span>RSM</span></a>
        <div class="si">
            <a href="https://www.instagram.com/pierluigi_berardi/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/pierluigi.berardi.7" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="admin.html" style="opacity:0.3; font-size: 12px;"><i class="fas fa-lock"></i></a>
        </div>
    </nav>

    <header class="reveal">
        <span class="hs">Eclectic DJ & Performer</span>
        <h1 class="ht">PIERLUIGI<br>BERARDI</h1>
    </header>

    <section id="events" class="reveal">
        <h2 class="st">Next Events</h2>
        <div id="eg" class="eg">
            </div>
    </section>

    <section id="vibes" class="reveal">
        <h2 class="st">Vibes</h2>
        <div id="vg" class="vg">
            </div>
    </section>

    <section id="reviews" class="reveal">
        <h2 class="st">Fan Love</h2>
        <div id="rg" class="rg">
            </div>
    </section>

    <footer style="padding:60px 0;text-align:center;border-top:1px solid rgba(255,255,255,.05);color:var(--mu);font-size:12px;letter-spacing:2px;text-transform:uppercase">
        © 2026 Pierluigi Berardi — All Vibes Reserved
    </footer>
</div>

<div id="lb">
    <div id="lbc">×</div>
    <div id="lbcontent"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDPAwh58NCFJ3CoTLvG8KcVXC5oQPIzXiI",
    authDomain: "sito-pilu.firebaseapp.com",
    projectId: "sito-pilu",
    storageBucket: "sito-pilu.firebasestorage.app",
    messagingSenderId: "423213362317",
    appId: "1:423213362317:web:809d1124411a6f3023c6c4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// CARICA EVENTI
async function loadEvents() {
    const q = query(collection(db, "eventi"), orderBy("date", "asc"));
    const snap = await getDocs(q);
    const container = document.getElementById('eg');
    container.innerHTML = '';
    
    if (snap.empty) {
        container.innerHTML = '<p style="color:var(--mu)">Nessun evento in programma.</p>';
        return;
    }

    snap.forEach(doc => {
        const d = doc.data();
        const date = new Date(d.date);
        const day = date.getDate();
        const month = date.toLocaleString('it-IT', { month: 'short' });
        
        container.innerHTML += `
            <div class="ec">
                <img src="${d.img}" class="ei" loading="lazy">
                <div class="ed">
                    <div class="et">${day} ${month}</div>
                    <div class="ey">Live Mix</div>
                </div>
            </div>
        `;
    });
}

// CARICA VIBES (GALLERIA)
async function loadVibes() {
    // Usiamo la collezione "gallery" e ordiniamo per il campo "ordine"
    const q = query(collection(db, "gallery"), orderBy("ordine", "asc"));
    const snap = await getDocs(q);
    const container = document.getElementById('vg');
    container.innerHTML = '';

    if (snap.empty) {
        container.innerHTML = '<p style="color:var(--mu)">Galleria in arrivo...</p>';
        return;
    }

    snap.forEach(doc => {
        const d = doc.data();
        const isVid = d.type === 'video';
        const item = document.createElement('div');
        item.className = 'vi';
        
        if(isVid) {
            item.innerHTML = `<video src="${d.src}" muted playsinline loop></video><div class="vp"><i class="fas fa-play"></i></div>`;
            item.onclick = () => openLB(d.src, true);
            // Autoplay al passaggio del mouse per i video
            item.onmouseenter = () => item.querySelector('video').play();
            item.onmouseleave = () => { const v = item.querySelector('video'); v.pause(); v.currentTime = 0; };
        } else {
            item.innerHTML = `<img src="${d.src}" loading="lazy">`;
            item.onclick = () => openLB(d.src, false);
        }
        container.appendChild(item);
    });
}

// CARICA RECENSIONI
async function loadReviews() {
    const q = query(collection(db, "recensioni"), orderBy("timestamp", "desc"), limit(6));
    const snap = await getDocs(q);
    const container = document.getElementById('rg');
    container.innerHTML = '';

    snap.forEach(doc => {
        const d = doc.data();
        container.innerHTML += `
            <div class="rc">
                <span class="rn">${d.nome}</span>
                <p class="rt">"${d.testo}"</p>
                <span class="rs">${"★".repeat(d.stelle || 5)}</span>
            </div>
        `;
    });
}

// LIGHTBOX
const lb = document.getElementById('lb');
const lbc = document.getElementById('lbcontent');
function openLB(src, isVid) {
    lbc.innerHTML = isVid ? `<video src="${src}" controls autoplay playsinline style="max-width:100%; max-height:80vh;"></video>` : `<img src="${src}">`;
    lb.classList.add('show');
}
document.getElementById('lbc').onclick = () => {
    lb.classList.remove('show');
    lbc.innerHTML = '';
};

// INIZIALIZZA
loadEvents();
loadVibes();
loadReviews();

// EFFETTO RIVELAZIONE AL CARICAMENTO/SCROLL
const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('on'); });
}, {threshold: 0.1});
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

// EFFETTO FUMO
const canvas = document.getElementById('sc'), ctx = canvas.getContext('2d');
const rsz = () => { canvas.width = innerWidth; canvas.height = innerHeight; }; window.addEventListener('resize', rsz); rsz();
const pts = Array.from({length: 25}, () => ({x: Math.random() * canvas.width, y: canvas.height + Math.random() * 100, r: Math.random() * 60 + 30, vy: -(Math.random() * 0.5 + 0.2), op: Math.random() * 0.05 + 0.01}));
(function smoke() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pts.forEach(p => {
        p.y += p.vy;
        if(p.y < -p.r) p.y = canvas.height + p.r;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(201,168,76,${p.op})`;
        ctx.fill();
    });
    requestAnimationFrame(smoke);
})();
</script>
</body>
</html>
