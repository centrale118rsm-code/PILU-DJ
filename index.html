<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pilu Admin Area</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background: #060606; color: #F0EDE8; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px;}
        .box { background: #141414; padding: 30px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); margin-bottom: 20px; }
        h1 { color: #C9A84C; margin-top: 0; letter-spacing: 2px; text-transform: uppercase; font-size: 24px; }
        h2 { color: #fff; font-size: 18px; margin-top: 30px; border-bottom: 1px solid #333; padding-bottom: 10px;}
        input, button, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0E0E0E; color: #fff; font-family: inherit; font-size: 16px; box-sizing: border-box; }
        input[type="file"] { padding: 10px; background: #1a1a1a; cursor: pointer; color: #C9A84C; }
        button { background: #C9A84C; color: #000; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.1s; }
        button:active { transform: scale(0.96); }
        .hidden { display: none !important; }
        #status, #vibe-status { margin-top: 15px; font-size: 15px; font-weight: bold; min-height: 20px; }
        .back-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #888; margin-top: 10px; }
        
        /* Stile lista eventi */
        .admin-event { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px; text-align: left; }
        .admin-event img { max-width: 80px; border-radius: 4px; float: left; margin-right: 15px; }
        .admin-event .details { overflow: hidden; }
        .admin-event input[type="datetime-local"] { padding: 8px; font-size: 14px; margin: 5px 0; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-edit { background: #43E660; padding: 8px; font-size: 12px; }
        .btn-del { background: #FF3B30; color: #fff; padding: 8px; font-size: 12px; }

        /* Stile lista recensioni */
        .admin-rev { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px; text-align: left; }
        .admin-rev-head { display: flex; justify-content: space-between; margin-bottom: 5px; color: #C9A84C; font-weight: bold; }
        .admin-rev-text { font-size: 14px; color: #ccc; margin-bottom: 10px; font-style: italic; }

        /* Stile lista Vibes (Galleria) */
        .admin-vibe { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; text-align: left; }
        .admin-vibe .media-preview { width: 70px; height: 70px; border-radius: 4px; object-fit: cover; margin-right: 15px; background: #000; }
        .admin-vibe-info { flex-grow: 1; overflow: hidden; }
        .admin-vibe-info .type { color: #C9A84C; font-weight: bold; text-transform: uppercase; font-size: 12px; margin-bottom: 4px; }
        .admin-vibe-info .order { font-size: 12px; color: #888; }
    </style>
</head>
<body>

    <div id="login-box" class="box">
        <h1>Area Riservata</h1>
        <p style="font-size: 14px; color: #888;">Accesso riservato alla gestione eventi</p>
        <input type="password" id="pass" placeholder="Password...">
        <button id="btn-login">Entra</button>
        <button class="back-btn" onclick="window.location.href='index.html'">Torna al Sito</button>
    </div>

    <div id="admin-box" class="box hidden">
        <h1>Nuovo Evento</h1>
        <input type="file" id="file-img" accept="image/*">
        <input type="datetime-local" id="data-evento">
        <button id="btn-upload">Pubblica Evento</button>
        <div id="status"></div>

        <div id="lista-eventi">
            <h2>Gestione Eventi Caricati</h2>
            <div id="events-container">Sto caricando gli eventi...</div>
        </div>

        <div id="lista-recensioni">
            <h2>Gestione Recensioni</h2>
            <div id="reviews-container">Sto caricando le recensioni...</div>
        </div>

        <div id="lista-vibes">
            <h2>Gestione Vibes (Galleria)</h2>
            
            <select id="vibe-type" style="margin-bottom: 10px; cursor: pointer;">
                <option value="image">Immagine (Carica File)</option>
                <option value="video">Video (Inserisci Link .mp4)</option>
            </select>
            
            <input type="file" id="vibe-file" accept="image/*">
            <input type="text" id="vibe-link" placeholder="Link video (es. https://.../video.mp4)" class="hidden">
            <input type="number" id="vibe-order" placeholder="Ordine di visualizzazione (es. 1, 2, 3...)" value="1">
            
            <button id="btn-upload-vibe">Aggiungi a Vibes</button>
            <div id="vibe-status"></div>

            <div id="vibes-container" style="margin-top: 15px;">Sto caricando le vibes...</div>
        </div>
        
        <button class="back-btn" onclick="window.location.href='index.html'">Esci</button>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDPAwh58NCFJ3CoTLvG8KcVXC5oQPIzXiI",
    authDomain: "sito-pilu.firebaseapp.com",
    projectId: "sito-pilu",
    storageBucket: "sito-pilu.firebasestorage.app",
    messagingSenderId: "423213362317",
    appId: "1:423213362317:web:809d1124411a6f3023c6c4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// CHIAVE IMGBB
const IMGBB_API_KEY = "e4660bfc2d38c3617e2bafc8230f3e37";

// LOGIN E CARICAMENTO LISTE
document.getElementById('btn-login').addEventListener('click', () => {
    if (document.getElementById('pass').value === "118rsm") {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('admin-box').classList.remove('hidden');
        loadAdminEvents(); 
        loadAdminReviews(); 
        loadAdminVibes(); // Carica anche la galleria
    } else {
        alert("Password errata!");
        document.getElementById('pass').value = '';
    }
});

// UPLOAD NUOVO EVENTO
document.getElementById('btn-upload').addEventListener('click', async () => {
    const fileInput = document.getElementById('file-img');
    const dataRaw = document.getElementById('data-evento').value;
    const status = document.getElementById('status');

    if (!fileInput.files[0] || !dataRaw) return alert("Inserisci immagine e data!");

    status.style.color = "#C9A84C";
    status.innerText = "Caricamento...";
    document.getElementById('btn-upload').disabled = true;

    try {
        const formData = new FormData();
        formData.append("image", fileInput.files[0]);
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
        const imgData = await response.json();
        if (!imgData.success) throw new Error("Caricamento ImgBB fallito");
        
        await addDoc(collection(db, "eventi"), { img: imgData.data.display_url, date: dataRaw + ":00" });

        status.style.color = "#43E660";
        status.innerText = "Pubblicato! ✅";
        fileInput.value = ""; document.getElementById('data-evento').value = "";
        loadAdminEvents(); 
    } catch (e) {
        status.style.color = "#FF3B30"; status.innerText = "Errore durante l'upload.";
        console.error(e);
    } finally {
        document.getElementById('btn-upload').disabled = false;
        setTimeout(() => { status.innerText = ""; }, 3000);
    }
});

// CARICA EVENTI
async function loadAdminEvents() {
    const container = document.getElementById('events-container');
    container.innerHTML = "Caricamento...";
    const snap = await getDocs(query(collection(db, "eventi"), orderBy("date", "desc")));
    
    if(snap.empty) { container.innerHTML = "<p style='color:#888; font-size:14px;'>Nessun evento caricato.</p>"; return; }
    
    container.innerHTML = "";
    snap.forEach(docSnap => {
        const data = docSnap.data();
        const eventId = docSnap.id;
        const rawDate = data.date ? data.date.substring(0, 16) : ""; 
        
        const div = document.createElement('div');
        div.className = 'admin-event';
        div.innerHTML = `
            <img src="${data.img}" alt="locandina">
            <div class="details">
                <input type="datetime-local" id="date-${eventId}" value="${rawDate}">
                <div class="btn-group">
                    <button class="btn-edit" onclick="aggiornaData('${eventId}')">Aggiorna Data</button>
                    <button class="btn-del" onclick="eliminaEvento('${eventId}')">Elimina</button>
                </div>
            </div>
            <div style="clear:both;"></div>
        `;
        container.appendChild(div);
    });
}

// CARICA RECENSIONI
async function loadAdminReviews() {
    const container = document.getElementById('reviews-container');
    container.innerHTML = "Caricamento...";
    const snap = await getDocs(query(collection(db, "recensioni"), orderBy("timestamp", "desc")));
    
    if(snap.empty) { container.innerHTML = "<p style='color:#888; font-size:14px;'>Nessuna recensione trovata.</p>"; return; }
    
    container.innerHTML = "";
    snap.forEach(docSnap => {
        const data = docSnap.data();
        const reviewId = docSnap.id;
        const stars = "⭐".repeat(data.stelle || 5);
        
        const div = document.createElement('div');
        div.className = 'admin-rev';
        div.innerHTML = `
            <div class="admin-rev-head"><span>${data.nome}</span><span>${stars}</span></div>
            <div class="admin-rev-text">"${data.testo}"</div>
            <button class="btn-del" style="width:100%; margin-top:0;" onclick="eliminaRecensione('${reviewId}')"><i class="fas fa-trash"></i> Elimina Recensione</button>
        `;
        container.appendChild(div);
    });
}

// --- INIZIO GESTIONE VIBES (GALLERIA) ---

// Cambia l'input in base al tipo (Immagine/Video)
document.getElementById('vibe-type').addEventListener('change', (e) => {
    if(e.target.value === 'image') {
        document.getElementById('vibe-file').classList.remove('hidden');
        document.getElementById('vibe-link').classList.add('hidden');
    } else {
        document.getElementById('vibe-file').classList.add('hidden');
        document.getElementById('vibe-link').classList.remove('hidden');
    }
});

// Carica nuova Vibe
document.getElementById('btn-upload-vibe').addEventListener('click', async () => {
    const type = document.getElementById('vibe-type').value;
    const order = parseInt(document.getElementById('vibe-order').value) || 99;
    const status = document.getElementById('vibe-status');
    
    status.style.color = "#C9A84C";
    status.innerText = "Salvataggio in corso...";
    document.getElementById('btn-upload-vibe').disabled = true;

    try {
        let finalUrl = "";
        
        if (type === 'image') {
            const fileInput = document.getElementById('vibe-file');
            if(!fileInput.files[0]) throw new Error("Seleziona un'immagine da caricare!");
            
            const formData = new FormData();
            formData.append("image", fileInput.files[0]);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const imgData = await response.json();
            if (!imgData.success) throw new Error("Caricamento ImgBB fallito");
            finalUrl = imgData.data.display_url;
        } else {
            finalUrl = document.getElementById('vibe-link').value.trim();
            if(!finalUrl) throw new Error("Inserisci un link valido per il video!");
        }

        // Salva su Firestore
        await addDoc(collection(db, "gallery"), { 
            src: finalUrl, 
            type: type, 
            ordine: order 
        });

        status.style.color = "#43E660";
        status.innerText = "Aggiunto alla galleria! ✅";
        
        // Reset campi
        document.getElementById('vibe-file').value = "";
        document.getElementById('vibe-link').value = "";
        document.getElementById('vibe-order').value = order + 1; // Incrementa automaticamente
        
        loadAdminVibes(); 
    } catch (e) {
        status.style.color = "#FF3B30"; 
        status.innerText = e.message || "Errore durante il salvataggio.";
        console.error(e);
    } finally {
        document.getElementById('btn-upload-vibe').disabled = false;
        setTimeout(() => { status.innerText = ""; }, 3000);
    }
});

// Carica la lista delle Vibes esistenti
async function loadAdminVibes() {
    const container = document.getElementById('vibes-container');
    container.innerHTML = "Caricamento...";
    
    const snap = await getDocs(query(collection(db, "gallery"), orderBy("ordine", "asc")));
    
    if(snap.empty) { 
        container.innerHTML = "<p style='color:#888; font-size:14px;'>Nessun file nella galleria.</p>"; 
        return; 
    }
    
    container.innerHTML = "";
    snap.forEach(docSnap => {
        const data = docSnap.data();
        const id = docSnap.id;
        
        const mediaHtml = data.type === 'video' 
            ? `<video class="media-preview" src="${data.src}" muted></video>` 
            : `<img class="media-preview" src="${data.src}" alt="vibe">`;

        const div = document.createElement('div');
        div.className = 'admin-vibe';
        div.innerHTML = `
            <div style="display: flex; align-items: center; width: 100%;">
                ${mediaHtml}
                <div class="admin-vibe-info">
                    <div class="type"><i class="fas ${data.type === 'video' ? 'fa-video' : 'fa-image'}"></i> ${data.type}</div>
                    <div class="order">Ordine: ${data.ordine}</div>
                </div>
                <button class="btn-del" onclick="eliminaVibe('${id}')" style="width: auto; margin: 0; padding: 10px 15px;"><i class="fas fa-trash"></i></button>
            </div>
        `;
        container.appendChild(div);
    });
}
// --- FINE GESTIONE VIBES ---


// FUNZIONI GLOBALI (ELIMINAZIONE E AGGIORNAMENTO)
window.eliminaEvento = async function(id) {
    if(confirm("Sei sicuro di voler eliminare questa locandina?")) {
        await deleteDoc(doc(db, "eventi", id));
        loadAdminEvents();
    }
};

window.aggiornaData = async function(id) {
    const nuovaData = document.getElementById(`date-${id}`).value;
    if(!nuovaData) return alert("Scegli una data valida");
    await updateDoc(doc(db, "eventi", id), { date: nuovaData + ":00" });
    alert("Data aggiornata con successo!");
    loadAdminEvents();
};

window.eliminaRecensione = async function(id) {
    if(confirm("Vuoi davvero cancellare questa recensione?")) {
        await deleteDoc(doc(db, "recensioni", id));
        loadAdminReviews();
    }
};

window.eliminaVibe = async function(id) {
    if(confirm("Sei sicuro di voler eliminare questo elemento dalla galleria?")) {
        await deleteDoc(doc(db, "gallery", id));
        loadAdminVibes();
    }
};
</script>
</body>
</html>
