<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilu Admin Area</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background: #060606; color: #F0EDE8; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { background: #141414; padding: 40px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1 { color: #C9A84C; margin-top: 0; letter-spacing: 2px; text-transform: uppercase; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0E0E0E; color: #fff; font-family: inherit; font-size: 16px; box-sizing: border-box; }
        input[type="file"] { padding: 10px; background: #1a1a1a; cursor: pointer; }
        button { background: #C9A84C; color: #000; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.1s; }
        button:active { transform: scale(0.96); }
        .hidden { display: none !important; }
        #status { margin-top: 15px; font-size: 14px; color: #43E660; }
    </style>
</head>
<body>

    <div id="login-box" class="box">
        <h1>Area Riservata</h1>
        <p>Inserisci la password di accesso</p>
        <input type="password" id="pass" placeholder="Password...">
        <button id="btn-login">Entra</button>
    </div>

    <div id="admin-box" class="box hidden">
        <h1>Nuovo Evento</h1>
        <p>Carica la locandina e imposta la data.</p>
        
        <label style="display:block; text-align:left; margin-top:15px; font-size:14px; color:#888;">Immagine Locandina</label>
        <input type="file" id="file-img" accept="image/jpeg, image/png">
        
        <label style="display:block; text-align:left; margin-top:10px; font-size:14px; color:#888;">Data e Ora Inizio</label>
        <input type="datetime-local" id="data-evento">
        
        <button id="btn-upload">Pubblica Evento</button>
        <div id="status"></div>
        
        <button onclick="window.location.href='index.html'" style="background:transparent; border:1px solid #C9A84C; color:#C9A84C; margin-top:30px;">Torna al Sito</button>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

// Configurazioni Firebase
const firebaseConfig = {
    apiKey: "AIzaSyDPAwh58NCFJ3CoTLvG8KcVXC5oQPIzXiI",
    authDomain: "sito-pilu.firebaseapp.com",
    projectId: "sito-pilu",
    storageBucket: "sito-pilu.firebasestorage.app",
    messagingSenderId: "423213362317",
    appId: "1:423213362317:web:809d1124411a6f3023c6c4",
    measurementId: "G-VXNEV82BP3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// GESTIONE PASSWORD
document.getElementById('btn-login').addEventListener('click', () => {
    const pass = document.getElementById('pass').value;
    if (pass === "118rsm") {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('admin-box').classList.remove('hidden');
    } else {
        alert("Password errata!");
    }
});

// GESTIONE CARICAMENTO
document.getElementById('btn-upload').addEventListener('click', async () => {
    const file = document.getElementById('file-img').files[0];
    const dataRaw = document.getElementById('data-evento').value;
    const status = document.getElementById('status');

    if (!file || !dataRaw) {
        alert("Devi inserire sia l'immagine che la data!");
        return;
    }

    status.style.color = "#C9A84C";
    status.innerText = "Caricamento in corso... attendi.";
    document.getElementById('btn-upload').disabled = true;

    try {
        // 1. Carica l'immagine su Firebase Storage
        const fileRef = ref(storage, 'eventi/' + Date.now() + '_' + file.name);
        await uploadBytes(fileRef, file);
        const imgUrl = await getDownloadURL(fileRef);

        // 2. Formatta la data per farla piacere al codice del sito (Aggiunge i secondi :00)
        const dataFormattata = dataRaw + ":00";

        // 3. Salva i dati su Firestore
        await addDoc(collection(db, "eventi"), {
            img: imgUrl,
            date: dataFormattata
        });

        status.style.color = "#43E660";
        status.innerText = "Evento pubblicato con successo! ✅";
        
        // Pulisce i campi
        document.getElementById('file-img').value = "";
        document.getElementById('data-evento').value = "";
        
    } catch (error) {
        console.error("Errore: ", error);
        status.style.color = "#FF3B30";
        status.innerText = "Errore durante il caricamento.";
    } finally {
        document.getElementById('btn-upload').disabled = false;
    }
});
</script>
</body>
</html>
